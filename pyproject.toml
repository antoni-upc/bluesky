[project]
name = "bluesky-simulator"
dynamic = ["version"]
dependencies = [
    "numpy >= 1.24, < 3",
    "scipy", # >= 1.13.0",
    "matplotlib", # >= 3.9.0",
    "pandas", # >= 2.2.0",
    "msgpack >= 1.0.0",
    "pyzmq >= 26, < 28",
    "bluesky-navdata",
    "openap",
]

authors = [
  { name="Joost Ellerbroek", email="j.ellerbroek@tudelft.nl" },
  { name="Jacco Hoekstra", email="j.m.hoekstra@tudelft.nl" }
]

description = "The Open Air Traffic Simulator."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",

    "Development Status :: 4 - Beta",

    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",

    "License :: OSI Approved :: MIT License",

    "Operating System :: OS Independent",
]
keywords = ['ATM', 'transport', 'simulation', 'aviation', 'aircraft']

[project.optional-dependencies]
pygame = ["pygame"]
qt6 = [
    "pyopengl",
    "PyQt6",
    "PyQt6-WebEngine",
    "bluesky-guidata"
]
console = ["textual"]
full =[
    "pygame",
    "pyopengl",
    "PyQt6",
    "PyQt6-WebEngine",
    "textual",
    "bluesky-guidata",
]
# For headless (server-only) bluesky environment: pip install bluesky-simulator[headless]
headless = [
  # no extra dependencies
]
pybada = ["pyBADA>=0.1.12,<0.2"]
era5 = ["cdsapi>=0.7,<0.8", "netCDF4>=1.7,<2"]
gfs = ["requests>=2.32,<3", "pygrib>=2.1.6,<3"]
recording = ["openpyxl>=3.1,<4"]
test = ["pytest>=9,<10"]
research = [
  "pyBADA>=0.1.12,<0.2",
  "cdsapi>=0.7,<0.8",
  "netCDF4>=1.7,<2",
  "requests>=2.32,<3",
  "pygrib>=2.1.6,<3",
  "openpyxl>=3.1,<4",
]

[project.scripts]
bluesky = "bluesky.__main__:main"

[project.urls]
Homepage = "https://github.com/TUDelft-CNS-ATM/bluesky"
Issues = "https://github.com/TUDelft-CNS-ATM/bluesky/issues"
Documentation = "https://github.com/TUDelft-CNS-ATM/bluesky/wiki"
Repository = "https://github.com/TUDelft-CNS-ATM/bluesky"

[build-system]
requires = ["hatchling==1.26.3", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"


[tool.hatch.build]
include = [
  "bluesky/*",
]
exclude = [
    'docs',
    'utils',
    'bluesky/test',
    'bluesky/resources/navdata',
    'bluesky/resources/graphics',
    'bluesky/resources/html'
]

[tool.hatch.build.targets.wheel.hooks.custom]
dependencies = ["setuptools>=69.1.1", "numpy"]

[tool.pytest.ini_options]
markers = [
  "smoke: dependency-free research feature smoke tests",
  "licensed_bada: tests requiring external licensed BADA datasets",
  "external_weather: tests requiring credentials or network weather data",
]
