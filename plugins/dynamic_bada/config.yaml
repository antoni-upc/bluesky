# ============================================================
# dynamic_bada plugin — configuration file
# ============================================================
# Edit this file to tune the plugin for your environment.
# All paths may be absolute or relative to the BlueSky root.
# ============================================================

# ----------------------------------------------------------
# pyBADA data directories
# ----------------------------------------------------------
bada3_dir:     "/home/paucr/bluesky/.venv/lib/python3.12/site-packages/pyBADA/aircraft/BADA3/DUMMY"
bada4_dir:     "/home/paucr/bluesky/.venv/lib/python3.12/site-packages/pyBADA/aircraft/BADA4/DUMMY"
bada3_version: "3.15"
bada4_version: "4.2"

# Fallback BADA4 model used when the requested type is not in the database
bada4_fallback: "Dummy-TWIN"

# Default BADA generation to use when no override applies (3 or 4)
default_bada_version: 3

# ----------------------------------------------------------
# Fidelity modes
#   0  Legacy kinematic  — no dynamic overrides (pure BlueSky)
#   1  Point-mass        — pyBADA ROCD + force-balance ax    [DEFAULT]
#   2  Coupled dynamic   — Mode 1 + roll dynamics, load factor n=1/cos(phi),
#                          turn-induced drag via CL_turn=n*CL, heading from
#                          psi_dot = g*tan(phi)/V_TAS  (level-turn approx)
# ----------------------------------------------------------
default_fidelity_mode: 1

# ----------------------------------------------------------
# Mode 2 roll dynamics
#   Maximum roll rate [deg/s] for bank angle tracking.
#   Typical transport aircraft: 3-5 deg/s.
# ----------------------------------------------------------
roll_rate_deg_s: 5.0

# Performance model update period [s]
# Matches BlueSky's built-in performance_dt default
performance_dt: 1.0

# ----------------------------------------------------------
# Flight-phase VS thresholds  [m/s]
# ----------------------------------------------------------
vs_threshold_climb_m_s:   0.5
vs_threshold_descent_m_s: -0.5

# ----------------------------------------------------------
# Minimum TAS guard (prevents division by zero) [m/s]
# ----------------------------------------------------------
min_tas_m_s: 1.0

# ----------------------------------------------------------
# Numerical integration
#   "euler"  — semi-implicit Euler (fast, stable for mode 1)
# ----------------------------------------------------------
integrator: "euler"
